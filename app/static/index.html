<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Radio</title>
<meta name="theme-color" content="#14161a">
<style>
:root {
  --bg: #f4f2ee; --card: #ffffff; --ink: #1d1f23; --muted: #6b6f78; --line: #e3e0da;
  --accent: #d9480f; --accent-ink: #fff; --ok: #2b8a3e; --warn: #c27c0e; --err: #c92a2a;
  --chip: #efece6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161a; --card: #1e2127; --ink: #eceef2; --muted: #9298a3; --line: #2d3139;
    --accent: #ff7a3d; --accent-ink: #14161a; --chip: #272b33; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
main.wide { max-width: 1180px; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 4px 0 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; flex: 1; }
nav { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
nav a { color: var(--muted); text-decoration: none; padding: 6px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; }
nav a.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
.speakers { display: grid; gap: 10px; }
.sp { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.sp.sel { border-color: var(--accent); }
.sp.off { opacity: .45; }
.sp-top { display: flex; align-items: center; gap: 10px; }
.sp-name { font-weight: 650; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
.dot.playing { background: var(--ok); } .dot.paused { background: var(--muted); }
.dot.connecting, .dot.retrying { background: var(--warn); } .dot.error { background: var(--err); }
.sp-now { margin: 6px 0 2px 19px; font-size: 14px; display: flex; gap: 10px; align-items: center; }
.sp-now > div { min-width: 0; }
.sp-now .t { color: var(--muted); font-size: 13px; }
.sp-now .e { color: var(--err); font-size: 13px; }
.art { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex: none; background: var(--chip); }
.sp-ctl { display: flex; align-items: center; gap: 8px; margin: 8px 0 0 19px; flex-wrap: wrap; }
.sp-ctl input[type=range] { flex: 1 1 120px; accent-color: var(--accent); }
.vol { width: 30px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.ctl3 { display: flex; gap: 4px; }
.ctl3 button { padding: 7px 10px; }
button { font: inherit; border: 0; border-radius: 10px; padding: 9px 14px; cursor: pointer; background: var(--chip); color: var(--ink); }
button.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
.target { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.target-label { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.target-label b { color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { min-width: 0; }
select, input[type=text], input[type=url], input[type=search] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 10px; }
.grow { flex: 1 1 200px; }
.stations { display: flex; flex-wrap: wrap; gap: 8px; }
.st { display: inline-flex; align-items: center; background: var(--chip); border-radius: 10px; max-width: 100%; }
.st button { background: none; padding: 8px 12px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.st .x { color: var(--muted); padding: 8px 10px 8px 2px; cursor: pointer; }
.st .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-right: 6px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: calc(100% - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 10; }
.empty { color: var(--muted); font-size: 14px; }

/* albums view */
.mini { position: sticky; top: 0; z-index: 5; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 10px 12px; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
.mini-top { display: flex; align-items: center; gap: 8px; }
.mini-top select { flex: 1 1 auto; min-width: 0; }
.mini .sp-now, .mini .sp-ctl { margin-left: 0; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.count { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(142px, 1fr)); gap: 14px; }
.tile { background: none; padding: 0; text-align: left; border-radius: 10px; color: var(--ink); }
.tile .cover { width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover; display: block; background: var(--chip); }
.tile .nocover { display: grid; place-items: center; font-size: 34px; color: var(--muted); }
.tile .tt { font-weight: 600; font-size: 13.5px; margin-top: 6px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .ta { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(640px, calc(100% - 24px)); max-height: calc(100% - 40px);
  background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.ad-head { display: flex; gap: 16px; padding: 16px; align-items: flex-end; flex-wrap: wrap; }
.ad-head img, .ad-head .nocover { width: 140px; height: 140px; border-radius: 10px; object-fit: cover; background: var(--chip); flex: none; }
.ad-head .nocover { display: grid; place-items: center; font-size: 40px; color: var(--muted); }
.ad-meta { flex: 1 1 220px; min-width: 0; }
.ad-meta h3 { margin: 0 0 4px; font-size: 19px; line-height: 1.25; }
.ad-meta .t { color: var(--muted); font-size: 14px; }
.ad-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.ad-close { position: absolute; top: 8px; right: 8px; background: var(--chip); padding: 6px 11px; }
.tracks { list-style: none; margin: 0; padding: 0 8px 12px; }
.tracks li { display: flex; gap: 10px; align-items: baseline; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.tracks li:hover { background: var(--chip); }
.tracks .n { width: 22px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; flex: none; }
.tracks .nm { flex: 1; min-width: 0; }
.tracks .ar { color: var(--muted); font-size: 12.5px; }
.tracks .d { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.tracks .disc { padding: 10px 10px 4px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; cursor: default; }
.tracks .disc:hover { background: none; }
</style>
</head>
<body>
<main id="main">
  <div class="top">
    <h1>📻 Home Radio</h1>
    <nav id="nav" hidden><a href="/" data-view="radio">Radio</a><a href="/plex" data-view="plex">Albums</a></nav>
  </div>

  <!-- ===== Radio view ===== -->
  <section id="view-radio">
    <h2 style="margin-top:0">Speakers</h2>
    <div class="speakers" id="speakers"><div class="empty">Looking for speakers…</div></div>

    <h2>Play</h2>
    <div class="target">
      <div class="target-label">on <b id="target-name">—</b> <span style="opacity:.7">(tap a speaker above to change)</span></div>

      <div class="row">
        <select id="net"></select>
        <input type="text" id="filter" class="grow" placeholder="Filter channels…" autocomplete="off">
      </div>
      <div class="row" style="margin-top:8px">
        <select id="chan" class="grow"></select>
        <button class="primary" id="play-chan">▶ Play</button>
      </div>

      <h2 style="margin-top:20px">Stations</h2>
      <div class="stations" id="stations"></div>

      <h2 style="margin-top:20px">Paste a link</h2>
      <div class="row">
        <input type="url" id="url" class="grow" placeholder="Radio stream, .pls/.m3u, or YouTube link" autocomplete="off">
      </div>
      <div class="row" style="margin-top:8px">
        <input type="text" id="url-name" class="grow" placeholder="Name (optional)" autocomplete="off">
        <button class="primary" id="add">Save &amp; play</button>
      </div>
      <div class="hint">Saved to Stations for next time. YouTube plays as audio only.</div>
    </div>
  </section>

  <!-- ===== Albums view (Plex) ===== -->
  <section id="view-plex" hidden>
    <div class="mini" id="mini"></div>
    <div class="tools">
      <input type="search" id="q" class="grow" placeholder="Search albums or artists…" autocomplete="off">
      <select id="sort">
        <option value="added">Recently added</option>
        <option value="artist">Artist</option>
        <option value="title">Album</option>
        <option value="year">Year (newest)</option>
        <option value="random">Shuffle the wall</option>
      </select>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <div id="sentinel" style="height:1px"></div>
  </section>
</main>

<dialog id="album"><div id="album-body"></div></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const LS = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let catalog = null, speakers = [], target = LS.get("target"), dragging = null;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 5000);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fold = (s) => String(s ?? "").normalize("NFD").replace(/\p{Diacritic}/gu, "").replace(/ł/g, "l").replace(/Ł/g, "L").toLowerCase();
// A cover that fails (Plex can't convert the file, NAS hiccup...) becomes the 💿 placeholder.
// Capture phase: "error" on <img> doesn't bubble.
document.addEventListener("error", (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement)) return;
  if (img.classList.contains("art")) return img.remove();
  const ph = document.createElement("div");
  ph.className = `${img.className} nocover`.trim();
  ph.textContent = "💿";
  img.replaceWith(ph);
}, true);
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

// =====================================================================
// "This device": the browser plays the stream itself
// =====================================================================
const audio = new Audio();
audio.preload = "none";
const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
const LOCAL = { id: "local", name: "This device", kind: "browser", online: true, status: "idle",
  volume: +(LS.get("local-vol") ?? 70), title: null, track: null, error: null, route: null,
  art: null, controls: false, queue: null };
const local = { gen: 0, key: null, source: null, retries: 0, tick: 0, q: null, qi: 0, fails: 0 };
audio.volume = (LOCAL.volume / 100) ** 2;

function setLocal(patch) { Object.assign(LOCAL, patch); if (!dragging) renderSpeakers(); updateMediaSession(); }

function unlockAudio() {   // iOS: the element must be played inside the tap itself, before any await
  try { audio.src = SILENT; audio.play().catch(() => {}); } catch {}
}

function tryUrl(url, gen, timeout = 12000) {
  return new Promise((resolve) => {
    let t;
    const done = (ok) => { audio.removeEventListener("playing", onOk); audio.removeEventListener("error", onErr); clearTimeout(t); resolve(ok); };
    const onOk = () => done(true), onErr = () => done(false);
    audio.addEventListener("playing", onOk); audio.addEventListener("error", onErr);
    t = setTimeout(() => done(false), timeout);
    audio.src = url;
    audio.play().catch((e) => { if (e.name === "NotAllowedError") LOCAL.error = "The browser blocked autoplay - tap Play again"; done(false); });
  });
}

async function playLocal(source, isRetry = false) {
  const gen = ++local.gen;
  local.source = source; local.q = null;
  if (!isRetry) local.retries = 0;
  setLocal({ status: "connecting", error: null, track: null, route: null, art: null, controls: false, queue: null });
  let info;
  try { info = await api("/api/browser/play", { method: "POST", body: { source } }); }
  catch (e) { return gen === local.gen && setLocal({ status: "error", error: e.message }); }
  if (gen !== local.gen) return;
  setLocal({ title: info.name });
  if (info.queue) { local.q = info.queue; local.fails = 0; return playQueueAt(0, gen); }
  local.key = info.key;
  // 1) straight from the station, like the Lenovo does
  for (const d of info.direct) {
    if (!audio.canPlayType(d.type)) continue;
    if (await tryUrl(d.url, gen)) return gen === local.gen && started("direct");
    if (gen !== local.gen) return;
  }
  // 2) fallback: the NAS converts it to MP3 (YouTube, HLS outside Safari, odd formats)
  try {
    const px = await api(`/api/browser/${info.key}/proxy`, { method: "POST" });
    if (gen !== local.gen) return;
    if (await tryUrl(px.url, gen, 45000)) return gen === local.gen && started("via NAS");
  } catch (e) { return gen === local.gen && setLocal({ status: "error", error: e.message }); }
  if (gen === local.gen) setLocal({ status: "error", error: LOCAL.error || "This browser couldn't play the stream" });
}

// --- album queue in the browser ---
async function playQueueAt(i, gen = ++local.gen) {
  if (!local.q || i < 0) return;
  if (i >= local.q.length) return stopLocal();
  local.qi = i;
  const t = local.q[i];
  setLocal({ status: "connecting", track: t.artist ? `${t.artist} - ${t.title}` : t.title, art: t.art,
    controls: true, queue: { index: i + 1, length: local.q.length }, route: null });
  if (await tryUrl(t.path, gen, 20000)) {
    if (gen === local.gen) { local.fails = 0; setLocal({ status: "playing", error: null }); }
    return;
  }
  if (gen !== local.gen) return;
  if (++local.fails >= 3) return setLocal({ status: "error", error: "Tracks keep failing to play" });
  playQueueAt(i + 1);                      // skip a broken track
}

// Plex play history: the server reports for speakers; for "This device" the page tells the server.
const CLIENT = LS.get("client") || (() => { const c = Math.random().toString(36).slice(2, 12); LS.set("client", c); return c; })();
setInterval(() => {
  const t = local.q?.[local.qi];
  if (!t?.plex || !["playing", "paused"].includes(LOCAL.status)) return;
  api("/api/plex/progress", { method: "POST", body: { client: CLIENT, track_id: t.id, time: audio.currentTime,
    state: LOCAL.status === "paused" ? "paused" : "playing" } }).catch(() => {});
}, 10000);

function localControl(action) {
  if (!local.q) return;
  if (action === "next") return playQueueAt(local.qi + 1);
  if (action === "prev") return audio.currentTime > 3 ? (audio.currentTime = 0) : playQueueAt(Math.max(0, local.qi - 1));
  if (audio.paused) { audio.play().catch(() => {}); setLocal({ status: "playing" }); }
  else { audio.pause(); setLocal({ status: "paused" }); }
}

function started(route) { local.retries = 0; setLocal({ status: "playing", error: null, route }); localTrack(); }

function stopLocal() {
  local.gen++; local.source = null; local.q = null;
  audio.pause(); audio.removeAttribute("src"); audio.load();
  setLocal({ status: "idle", title: null, track: null, error: null, route: null, art: null, controls: false, queue: null });
}

async function localTrack() {
  if (LOCAL.status !== "playing" || !local.key || local.q) return;
  try { const r = await api(`/api/browser/${local.key}/track`); setLocal({ track: r.track }); } catch {}
}

audio.addEventListener("ended", () => { if (local.q && LOCAL.status === "playing") playQueueAt(local.qi + 1); });
// a live stream that drops: reconnect a few times
for (const ev of ["error", "ended"]) audio.addEventListener(ev, () => {
  if (local.q || LOCAL.status !== "playing" || !local.source) return;
  if (++local.retries > 5) return setLocal({ status: "error", error: "Stream keeps dropping" });
  const src = local.source, gen = local.gen;
  setLocal({ status: "retrying", error: "Stream dropped - reconnecting" });
  setTimeout(() => gen === local.gen && playLocal(src, true), 3000);
});

function updateMediaSession() {
  if (!("mediaSession" in navigator)) return;
  if (LOCAL.status === "idle") { navigator.mediaSession.metadata = null; return; }
  const art = LOCAL.art ? [{ src: `${LOCAL.art}?s=512`, sizes: "512x512" }] : [];
  navigator.mediaSession.metadata = local.q
    ? new MediaMetadata({ title: local.q[local.qi]?.title || "", artist: local.q[local.qi]?.artist || "",
        album: local.q[local.qi]?.album || "", artwork: art })
    : new MediaMetadata({ title: LOCAL.track || LOCAL.title || "Home Radio", artist: LOCAL.track ? LOCAL.title : "Home Radio" });
}
if ("mediaSession" in navigator) {
  const ms = navigator.mediaSession;
  ms.setActionHandler("pause", () => {
    if (local.q) return localControl("toggle");   // a track: real pause
    const s = local.source; stopLocal(); local.source = s; setLocal({ status: "paused", title: LOCAL.title });
  });
  ms.setActionHandler("play", () => {
    if (local.q) return localControl("toggle");
    if (local.source) playLocal(local.source);    // live: rejoin "now", not stale buffer
  });
  ms.setActionHandler("stop", stopLocal);
  ms.setActionHandler("nexttrack", () => localControl("next"));
  ms.setActionHandler("previoustrack", () => localControl("prev"));
}

// =====================================================================
// Speakers
// =====================================================================
const STATUS = { paused: "Paused", idle: "Stopped", connecting: "Connecting…", playing: "", retrying: "Reconnecting…", error: "Error", other: "Playing from another app" };
const allSpeakers = () => [LOCAL, ...speakers];

function nowHtml(s) {
  if (["playing", "connecting", "retrying", "paused"].includes(s.status)) {
    const q = s.queue ? ` <span class="t">· ${s.queue.index}/${s.queue.length}</span>` : "";
    return `<div class="sp-now">${s.art ? `<img class="art" src="${esc(s.art)}?s=96" alt="">` : ""}<div>
        ${esc(s.title || "")}${s.status !== "playing" ? ` <span class="t">· ${STATUS[s.status]}</span>` : ""}${s.route ? ` <span class="t">· ${s.route}</span>` : ""}
        ${s.track ? `<div class="t">🎵 ${esc(s.track)}${q}</div>` : ""}
        ${s.status === "retrying" && s.error ? `<div class="e">${esc(s.error)}</div>` : ""}</div></div>`;
  }
  return `<div class="sp-now"><div><span class="t">${STATUS[s.status] || s.status}${s.status === "other" && s.error ? ": " + esc(s.error) : ""}</span>
      ${s.status === "error" ? `<div class="e">${esc(s.error)}</div>` : ""}</div></div>`;
}

function ctlHtml(s) {
  const vol = dragging === s.id ? $("v-" + s.id)?.value ?? s.volume : s.volume;
  const id = esc(s.id);
  const three = s.controls ? `<span class="ctl3">
      <button data-ctl="prev" data-sid="${id}" title="Previous">⏮</button>
      <button data-ctl="toggle" data-sid="${id}" title="Pause / resume">${s.status === "paused" ? "▶" : "⏸"}</button>
      <button data-ctl="next" data-sid="${id}" title="Next">⏭</button></span>` : "";
  return `<div class="sp-ctl">${three}
      <input type="range" min="0" max="100" value="${vol}" id="v-${id}" data-vol="${id}">
      <span class="vol" id="vl-${id}">${vol}</span>
      <button data-stop="${id}" ${s.status === "idle" ? "disabled" : ""}>■ Stop</button></div>`;
}

function renderSpeakers() {
  const all = allSpeakers();
  if (!all.some(s => s.id === target)) target = (speakers.find(s => s.online) || LOCAL).id;
  $("target-name").textContent = all.find(s => s.id === target)?.name || "—";
  $("speakers").innerHTML = all.map(s => `<div class="sp ${s.id === target ? "sel" : ""} ${s.online ? "" : "off"}" data-id="${esc(s.id)}">
      <div class="sp-top"><span class="dot ${s.status}"></span><span class="sp-name">${esc(s.name)}</span>
        <span class="badge">${{ cast: "Cast", airplay: "AirPlay", browser: "Browser" }[s.kind]}</span></div>
      ${nowHtml(s)}${ctlHtml(s)}</div>`).join("");
  renderMini();
}

function renderMini() {   // the Albums view: one compact player for the selected speaker
  if ($("view-plex").hidden) return;
  const all = allSpeakers(), s = all.find(x => x.id === target) || LOCAL;
  if (document.activeElement?.id === "mini-sel") return;      // don't rebuild under an open dropdown
  $("mini").innerHTML = `<div class="mini-top"><span class="dot ${s.status}"></span>
      <select id="mini-sel" aria-label="Speaker">${all.map(x => `<option value="${esc(x.id)}" ${x.id === s.id ? "selected" : ""} ${x.online ? "" : "disabled"}>${esc(x.name)}</option>`).join("")}</select></div>
    ${nowHtml(s)}${ctlHtml(s)}`;
}

function selectTarget(id) { target = id; LS.set("target", target); renderSpeakers(); }

$("speakers").addEventListener("click", (e) => {
  if (e.target.closest("input,button")) return;
  const card = e.target.closest(".sp"); if (card) selectTarget(card.dataset.id);
});
document.addEventListener("change", (e) => { if (e.target.id === "mini-sel") { selectTarget(e.target.value); e.target.blur(); } });

// stop / prev / pause / next / volume - delegated, so they work in both views
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.stop) {
    const id = b.dataset.stop;
    if (id === "local") return stopLocal();
    b.disabled = true;
    try { await api(`/api/speakers/${encodeURIComponent(id)}/stop`, { method: "POST" }); } catch (err) { toast(err.message); }
    return refresh();
  }
  if (b.dataset.ctl) {
    const id = b.dataset.sid;
    if (id === "local") return localControl(b.dataset.ctl);
    try { await api(`/api/speakers/${encodeURIComponent(id)}/control`, { method: "POST", body: { action: b.dataset.ctl } }); }
    catch (err) { toast(err.message); }
    return refresh();
  }
});
document.addEventListener("input", (e) => {
  const id = e.target.dataset?.vol; if (!id) return;
  dragging = id; $("vl-" + id).textContent = e.target.value;
  if (id === "local") { LOCAL.volume = +e.target.value; audio.volume = (LOCAL.volume / 100) ** 2; LS.set("local-vol", LOCAL.volume); }
});
document.addEventListener("change", async (e) => {
  const id = e.target.dataset?.vol; if (!id) return;
  if (id === "local") { dragging = null; return; }
  try { await api(`/api/speakers/${encodeURIComponent(id)}/volume`, { method: "POST", body: { volume: +e.target.value } }); }
  catch (err) { toast(err.message); }
  dragging = null;
});

async function refresh() {
  if (++local.tick % 5 === 0) localTrack();   // ~15 s
  try { speakers = (await api("/api/state")).speakers; if (!dragging) renderSpeakers(); }
  catch (e) { /* server restarting; try again next tick */ }
}

async function play(source) {
  if (!target) return toast("Pick a speaker first");
  if (target === "local") { unlockAudio(); return playLocal(source); }
  try { await api(`/api/speakers/${encodeURIComponent(target)}/play`, { method: "POST", body: { source } }); }
  catch (e) { toast(e.message); }
  refresh();
}

// =====================================================================
// Radio view
// =====================================================================
function renderChannels() {
  const net = $("net").value, q = $("filter").value.trim().toLowerCase();
  const n = catalog.networks.find(n => n.id === net);
  const match = (c) => !q || c.name.toLowerCase().includes(q);
  let html = "";
  const favs = net === "di" ? catalog.favorites.filter(match) : [];
  if (favs.length) html += `<optgroup label="★ Favorites">${favs.map(c => `<option value="${esc(c.key)}">${esc(c.name)}</option>`).join("")}</optgroup>`;
  const all = n.channels.filter(match);
  html += `<optgroup label="${esc(n.name)} · ${all.length}">${all.map(c => `<option value="${esc(c.key)}">${esc(c.name)}</option>`).join("")}</optgroup>`;
  const keep = $("chan").value;
  $("chan").innerHTML = html;
  if ([...$("chan").options].some(o => o.value === keep)) $("chan").value = keep;
  LS.set("net", net);
}

function renderStations() {
  const b = catalog.builtin.map(s => `<span class="st"><button data-src='${esc(JSON.stringify({ type: "builtin", id: s.id }))}'>${esc(s.name)}</button></span>`);
  const sv = catalog.saved.map(s => `<span class="st" title="${esc(s.url)}"><button data-src='${esc(JSON.stringify({ type: "saved", id: s.id }))}'>${s.kind === "ytdl" ? '<span class="kind">YT</span>' : s.kind === "ytlist" ? '<span class="kind">YT ≡</span>' : ""}${esc(s.name)}</button><span class="x" data-del="${esc(s.id)}" title="Remove">✕</span></span>`);
  $("stations").innerHTML = b.concat(sv).join("");
}

$("stations").addEventListener("click", async (e) => {
  const del = e.target.dataset?.del;
  if (del) {
    await api(`/api/saved/${del}`, { method: "DELETE" }).catch(err => toast(err.message));
    catalog.saved = catalog.saved.filter(s => s.id !== del); renderStations(); return;
  }
  const btn = e.target.closest("button[data-src]");
  if (btn) play(JSON.parse(btn.dataset.src));
});

$("net").addEventListener("change", () => { $("filter").value = ""; renderChannels(); });
$("filter").addEventListener("input", renderChannels);
$("play-chan").addEventListener("click", () => {
  if (!$("chan").value) return toast("No channel matches");
  play({ type: "aa", net: $("net").value, key: $("chan").value });
});

$("add").addEventListener("click", async () => {
  const url = $("url").value.trim(); if (!url) return toast("Paste a link first");
  if (target === "local") unlockAudio();   // before the awaits, while we still have the tap
  const btn = $("add"); btn.disabled = true; btn.textContent = "Checking…";
  try {
    const entry = await api("/api/saved", { method: "POST", body: { url, name: $("url-name").value } });
    if (!catalog.saved.some(s => s.id === entry.id)) catalog.saved.push(entry);
    renderStations(); $("url").value = ""; $("url-name").value = "";
    await play({ type: "saved", id: entry.id });
  } catch (e) { toast(e.message); }
  btn.disabled = false; btn.textContent = "Save & play";
});

// =====================================================================
// Albums view (Plex)
// =====================================================================
const PAGE = 96;
const lib = { albums: null, list: [], shown: 0, loading: false };

async function loadAlbums() {
  if (lib.albums || lib.loading) return;
  lib.loading = true; $("count").textContent = "Loading library…";
  try { lib.albums = await api("/api/plex/albums"); lib.albums.forEach(a => a._k = fold(`${a.title} ${a.artist}`)); }
  catch (e) { $("count").textContent = ""; toast(e.message); }
  lib.loading = false;
  filterAlbums();
}

function filterAlbums() {
  if (!lib.albums) return;
  const words = fold($("q").value).split(/\s+/).filter(Boolean);
  let list = lib.albums.filter(a => words.every(w => a._k.includes(w)));
  const sort = $("sort").value; LS.set("sort", sort);
  const by = (k) => (a, b) => fold(a[k]).localeCompare(fold(b[k]));
  if (sort === "added") list.sort((a, b) => b.added - a.added);
  else if (sort === "artist") list.sort((a, b) => by("artist")(a, b) || (a.year || 0) - (b.year || 0));
  else if (sort === "title") list.sort(by("title"));
  else if (sort === "year") list.sort((a, b) => (b.year || 0) - (a.year || 0) || b.added - a.added);
  else list.sort(() => Math.random() - .5);
  lib.list = list; lib.shown = 0; $("grid").innerHTML = "";
  $("count").textContent = `${list.length} ${list.length === 1 ? "album" : "albums"}`;
  moreAlbums();
}

function moreAlbums() {
  const next = lib.list.slice(lib.shown, lib.shown + PAGE);
  lib.shown += next.length;
  $("grid").insertAdjacentHTML("beforeend", next.map(a => `<button class="tile" data-album="${esc(a.id)}">
      ${a.thumb ? `<img class="cover" loading="lazy" src="/plex/thumb/${esc(a.id)}?s=300" alt="">` : `<div class="cover nocover">💿</div>`}
      <div class="tt">${esc(a.title)}</div><div class="ta">${esc(a.artist)}${a.year ? " · " + a.year : ""}</div></button>`).join(""));
}
new IntersectionObserver((es) => { if (es[0].isIntersecting && lib.list.length > lib.shown && !$("view-plex").hidden) moreAlbums(); },
  { rootMargin: "800px" }).observe($("sentinel"));

let qTimer;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(filterAlbums, 150); });
$("sort").addEventListener("change", filterAlbums);

$("grid").addEventListener("click", (e) => { const t = e.target.closest("[data-album]"); if (t) openAlbum(t.dataset.album); });

async function openAlbum(id) {
  const box = $("album-body");
  box.innerHTML = `<div style="padding:24px" class="empty">Loading…</div>`;
  $("album").showModal();
  let a;
  try { a = await api(`/api/plex/albums/${encodeURIComponent(id)}`); } catch (e) { box.innerHTML = `<div style="padding:24px" class="e">${esc(e.message)}</div>`; return; }
  const total = a.tracks.reduce((s, t) => s + t.duration, 0);
  const discs = new Set(a.tracks.map(t => t.disc)).size > 1;
  let lastDisc = null;
  const rows = a.tracks.map((t, i) => {
    let head = "";
    if (discs && t.disc !== lastDisc) { lastDisc = t.disc; head = `<li class="disc">Disc ${esc(t.disc)}</li>`; }
    const other = t.artist && t.artist !== a.artist ? `<div class="ar">${esc(t.artist)}</div>` : "";
    return `${head}<li data-start="${i}"><span class="n">${esc(t.index ?? i + 1)}</span><span class="nm">${esc(t.title)}${other}</span><span class="d">${mmss(t.duration)}</span></li>`;
  }).join("");
  box.innerHTML = `<button class="ad-close" data-close>✕</button>
    <div class="ad-head">${a.thumb ? `<img src="/plex/thumb/${esc(a.id)}?s=400" alt="">` : `<div class="nocover">💿</div>`}
      <div class="ad-meta"><h3>${esc(a.title)}</h3>
        <div class="t">${esc(a.artist)}${a.year ? " · " + a.year : ""} · ${a.tracks.length} tracks · ${Math.round(total / 60)} min</div>
        <div class="t" style="margin-top:4px">on <b id="ad-target"></b></div>
        <div class="ad-actions"><button class="primary" data-play="0">▶ Play</button><button data-shuffle>🔀 Shuffle</button></div></div></div>
    <ul class="tracks">${rows}</ul>`;
  $("ad-target").textContent = allSpeakers().find(s => s.id === target)?.name || "—";
  box.dataset.id = a.id;
}

$("album").addEventListener("click", (e) => {
  const d = $("album");
  if (e.target === d || e.target.closest("[data-close]")) return d.close();   // backdrop or ✕
  const id = $("album-body").dataset.id;
  const li = e.target.closest("[data-start]"), pb = e.target.closest("[data-play]");
  if (li || pb) { play({ type: "plex_album", id, start: +(li || pb).dataset[li ? "start" : "play"] }); return d.close(); }
  if (e.target.closest("[data-shuffle]")) { play({ type: "plex_album", id, shuffle: true }); d.close(); }
});

// =====================================================================
// Views: one document, so "This device" keeps playing while you switch
// =====================================================================
function showView(v, push) {
  if (v === "plex" && !catalog?.plex) v = "radio";
  $("view-radio").hidden = v !== "radio";
  $("view-plex").hidden = v !== "plex";
  $("main").classList.toggle("wide", v === "plex");
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.view === v));
  document.title = v === "plex" ? "Albums · Home Radio" : "Home Radio";
  if (push) history.pushState({}, "", v === "plex" ? "/plex" : "/");
  if (v === "plex") { loadAlbums(); renderMini(); }
}
$("nav").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-view]"); if (!a) return;
  e.preventDefault(); showView(a.dataset.view, true);
});
window.addEventListener("popstate", () => showView(location.pathname.startsWith("/plex") ? "plex" : "radio"));

(async function init() {
  refresh(); setInterval(refresh, 3000);
  catalog = await api("/api/catalog");
  $("nav").hidden = !catalog.plex;
  const hasNets = catalog.networks.length > 0;   // no AudioAddict key configured -> hide the channel picker
  if (!hasNets) for (const id of ["net", "chan"]) $(id).parentElement.style.display = "none";
  $("net").innerHTML = catalog.networks.map(n => `<option value="${n.id}">${esc(n.name)}</option>`).join("");
  const saved = LS.get("net"); if (saved && catalog.networks.some(n => n.id === saved)) $("net").value = saved;
  if (hasNets) renderChannels();
  renderStations();
  const sort = LS.get("sort"); if (sort) $("sort").value = sort;
  showView(location.pathname.startsWith("/plex") ? "plex" : "radio");
})();
</script>
